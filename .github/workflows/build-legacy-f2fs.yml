name: Kernel InfiniR A15 - KSUN legacy (branch) + SUSFS 2.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone kernel source (raystef66, branch 15.0)
        run: git clone --depth=1 -b 15.0 https://github.com/raystef66/kernel_xiaomi_cepheus kernel

      - name: Clone KernelSU-Next branch legacy (ganti dari tarball commit hash)
        run: |
          cd kernel
          rm -rf KernelSU-Next
          # Full clone (bukan --depth=1) supaya `git describe` bisa jalan
          # dan KSU_VERSION ke-generate otomatis dari jumlah commit + tag,
          # gak perlu hardcode KSU_VERSION_FALLBACK lagi kayak cara tarball dulu.
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next ksun-src
          rm -rf ksun-src/.git
          mkdir -p KernelSU-Next
          cp -r ksun-src/. KernelSU-Next/
          rm -rf ksun-src
          ls KernelSU-Next/kernel/
          echo "=== HEAD legacy branch yang dipakai ==="
          git clone -b legacy --depth=1 https://github.com/KernelSU-Next/KernelSU-Next ksun-headcheck
          git -C ksun-headcheck log -1 --format="%H %ai %s"
          rm -rf ksun-headcheck

      - name: Cek KSU_VERSION fallback (safety net - .git sudah dihapus di atas)
        run: |
          cd kernel
          # Karena .git dihapus (biar gak kebawa history KSUN ke repo kernel),
          # `git describe` gak akan jalan di dalam KernelSU-Next/. Branch
          # `legacy` sendiri sudah punya default KSU_VERSION_FALLBACK := 1
          # di Kbuild-nya -- gak perlu di-sed paksa kayak cara tarball dulu
          # (yang butuh hardcode angka commit-count manual: 33129). Cukup
          # diverifikasi aja nilainya ada dan masuk akal.
          grep "KSU_VERSION_FALLBACK" KernelSU-Next/kernel/Kbuild

      - name: Update defconfig localversion
        run: |
          cd kernel
          sed -i 's/CONFIG_LOCALVERSION="-InfiniR_cepheus_v1.39_KSUN"/CONFIG_LOCALVERSION="-DRAGON-KSUN-LEGACY-F2FS"/' arch/arm64/configs/cepheus_defconfig
          grep "CONFIG_LOCALVERSION" arch/arm64/configs/cepheus_defconfig

      - name: Install toolchain (clang + GNU cross-compiler)
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm bc bison flex libssl-dev libelf-dev build-essential
          sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Fix yamltree.c (stub kosong, solusi dari TURTLE)
        run: |
          cd kernel
          cat > scripts/dtc/yamltree.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>

          struct dt_info;

          void dt_to_yaml(FILE *outf, struct dt_info *dti) {}
          CEOF
          echo "yamltree.c replaced with stub"

      - name: Upgrade SUSFS ke v2.1.0 (sinkron sama KSUN legacy)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/susfs.c" -o fs/susfs.c
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs.h" -o include/linux/susfs.h
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          grep "SUSFS_VERSION" include/linux/susfs.h

      - name: Sinkronkan fs/stat.c dengan SUSFS v2.1.0 (fix undefined symbol)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/stat.c" -o fs/stat.c
          grep -c "susfs" fs/stat.c

      - name: Sinkronkan fs/proc/task_mmu.c juga (biasanya sepaket sama stat.c)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/proc/task_mmu.c" -o fs/proc/task_mmu.c
          grep -c "susfs" fs/proc/task_mmu.c

      - name: Inject 4 manual hook wajib KSUN (exec.c, open.c, stat.c, reboot.c)
        run: |
          cd kernel
          python3 - << 'PYEOF'
          import re, sys

          # CATATAN PERUBAHAN vs versi KSUN 3.2.0 (pinned commit) sebelumnya:
          # - Hook #3 (fs/read_write.c / ksu_handle_sys_read) DIHAPUS dari sini.
          #   Ternyata raystef66/kernel_xiaomi_cepheus SUDAH punya hook
          #   sendiri yang di-bake langsung ke fs/read_write.c (di dalam
          #   vfs_read(), bukan di SYSCALL_DEFINE3(read,...)) yang manggil
          #   ksu_handle_vfs_read(&file, &buf, &count, &pos) -- ini beda
          #   nama & signature dari ksu_handle_sys_read yang dulu kita patch
          #   manual. Symbol ksu_handle_vfs_read itu didefinisikan otomatis
          #   oleh KSUN legacy SELAMA CONFIG_KPROBES tidak dipaksa nyala
          #   (lihat step "Enable F2FS optimization" -- KSU_MANUAL_HOOK
          #   default y kalau !KPROBES). Jadi hook read udah otomatis
          #   ke-cover, gak perlu dipatch manual dari sini sama sekali.
          # - Hook #1, #2, #4, #5 (execveat, faccessat, stat, reboot) TIDAK
          #   berubah -- signature sudah dicek identik dengan branch legacy
          #   HEAD saat ini, aman dipakai apa adanya.

          def patch(path, extern_anchor_pattern, extern_code, call_anchor_pattern, call_code, tag):
              with open(path, "r") as f:
                  src = f.read()

              if tag in src:
                  print(f"[{path}] {tag} sudah ada, skip")
                  return

              if extern_anchor_pattern is not None:
                  m = re.search(extern_anchor_pattern, src)
                  if not m:
                      print(f"[{path}] GAGAL: extern anchor gak ketemu -> {extern_anchor_pattern}")
                      sys.exit(1)
                  insert_at = m.start()
                  src = src[:insert_at] + extern_code + src[insert_at:]

              m2 = re.search(call_anchor_pattern, src)
              if not m2:
                  print(f"[{path}] GAGAL: call anchor gak ketemu -> {call_anchor_pattern}")
                  sys.exit(1)
              insert_at2 = m2.start()
              src = src[:insert_at2] + call_code + src[insert_at2:]

              with open(path, "w") as f:
                  f.write(src)
              print(f"[{path}] {tag} berhasil di-patch")

          # 1. fs/exec.c -> ksu_handle_execveat (signature tidak berubah)
          patch(
              "fs/exec.c",
              r"int do_execve\(struct filename \*filename,",
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n\n",
              r"return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);",
              "#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\t",
              "KSU_HOOK_EXEC",
          )

          # 2. fs/open.c -> ksu_handle_faccessat (signature tidak berubah)
          patch(
              "fs/open.c",
              r"SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)",
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n\n",
              r"if \(mode & ~S_IRWXO\)",
              "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n\t",
              "KSU_HOOK_FACCESSAT",
          )

          # 3. fs/stat.c -> ksu_handle_stat (signature tidak berubah)
          # CATATAN: fs/stat.c versi SUSFS v2.1.0 SUDAH mendeklarasikan
          # "extern int ksu_handle_stat(int *dfd, const char __user **filename_user);"
          # dengan 2 argumen (bukan 3). Jangan tambah extern baru -- cukup
          # insert pemanggilannya saja, 2-arg, biar match sama signature asli.
          patch(
              "fs/stat.c",
              None,
              "",
              r"error = vfs_fstatat\(dfd, filename, &stat, flag\);",
              "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename);\n#endif\n\t",
              "KSU_HOOK_STAT",
          )

          # 4. kernel/reboot.c -> ksu_handle_sys_reboot (signature tidak berubah)
          patch(
              "kernel/reboot.c",
              r"SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,",
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
              "#endif\n\n",
              r"/\* We only trust the superuser with rebooting the system\. \*/",
              "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\t",
              "KSU_HOOK_REBOOT",
          )
          PYEOF
          echo "=== Ringkasan hook yang kepasang ==="
          grep -rn "ksu_handle_" fs/exec.c fs/open.c fs/stat.c kernel/reboot.c

      - name: Verify hook call-sites (verify_ksu_hooks.py)
        run: |
          cd kernel
          # --sys-read DIHAPUS dari sini karena hook itu sekarang otomatis
          # via kprobe internal KSUN, bukan call-site manual lagi.
          python3 ../verify_ksu_hooks.py \
            --dfd fs/stat.c \
            --execveat fs/exec.c \
            --faccessat fs/open.c \
            --reboot kernel/reboot.c || {
            echo "Verifikasi hook GAGAL — cek output di atas sebelum lanjut build.";
            exit 1;
          }

      - name: Commit perubahan lokal sebelum cherry-pick
        run: |
          cd kernel
          git config user.email "ci@build.local"
          git config user.name "CI Build"
          git add -A
          git commit -m "local changes: defconfig + 4 KSUN manual hooks (exec/open/stat/reboot) + KSUN legacy branch" || echo "nothing to commit"

      - name: Enable F2FS optimization di defconfig
        run: |
          cd kernel
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_XATTR=y
          CONFIG_F2FS_FS_POSIX_ACL=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_F2FS_CHECK_FS=y
          EOF
          echo "=== F2FS options added ==="
          grep "CONFIG_F2FS" arch/arm64/configs/cepheus_defconfig
          echo
          echo "=== Eksplisit kunci ke manual-hook mode (bukan cuma ngandelin default) ==="
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          EOF
          grep -E "CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_KPROBES_HOOK" arch/arm64/configs/cepheus_defconfig
          echo
          echo "=== CATATAN: CONFIG_KPROBES SENGAJA TIDAK diaktifkan ==="
          echo "KSUN legacy: KSU_MANUAL_HOOK default y kalau !KPROBES, dan"
          echo "KSU_KPROBES_HOOK eksplisit nulis 'should not be used on"
          echo "kernel below 5.10' di Kconfig-nya sendiri. Kernel Dragon"
          echo "Turtle 4.14 harus tetap di manual-hook mode -- itu juga yang"
          echo "nyediain symbol ksu_handle_vfs_read & ksu_input_hook yang"
          echo "dibutuhkan fs/read_write.c dan selinux_hide.c bawaan"
          echo "raystef66. Kalau CONFIG_KPROBES dipaksa nyala, KSUN pindah ke"
          echo "jalur tracepoint+kretprobe dan dua symbol itu hilang -> "
          echo "linker error 'undefined symbol'."

      - name: Enable OverlayFS full feature (redirect_dir + index) di defconfig
        run: |
          cd kernel
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          EOF
          echo "=== OverlayFS options added ==="
          grep "CONFIG_OVERLAY_FS" arch/arm64/configs/cepheus_defconfig

      - name: Build kernel (pakai flag dari build.sh asli raystef66)
        run: |
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export AR=llvm-ar
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=1

          make O=out ARCH=arm64 cepheus_defconfig

          make ARCH=arm64 \
               O=out \
               CC=clang \
               AR=llvm-ar \
               LD=ld.lld \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               -j$(nproc --all) Image.gz-dtb

          echo "=== Verify Image.gz-dtb ==="
          ls out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/Image kernel-pure.img
          cd AnyKernel3 && zip -r9 ../InfiniR_cepheus_KSUN-legacy_F2FS.zip * -x README

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniR-cepheus-KSUN-legacy-F2FS
          path: |
            InfiniR_cepheus_KSUN-legacy_F2FS.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel-pure.img          # Karena .git dihapus (biar gak kebawa history KSUN ke repo kernel),
          # `git describe` gak akan jalan di dalam KernelSU-Next/. Branch
          # `legacy` sendiri sudah punya default KSU_VERSION_FALLBACK := 1
          # di Kbuild-nya -- gak perlu di-sed paksa kayak cara tarball dulu
          # (yang butuh hardcode angka commit-count manual: 33129). Cukup
          # diverifikasi aja nilainya ada dan masuk akal.
          grep "KSU_VERSION_FALLBACK" KernelSU-Next/kernel/Kbuild

      - name: Update defconfig localversion
        run: |
          cd kernel
          sed -i 's/CONFIG_LOCALVERSION="-InfiniR_cepheus_v1.39_KSUN"/CONFIG_LOCALVERSION="-DRAGON-KSUN-LEGACY-F2FS"/' arch/arm64/configs/cepheus_defconfig
          grep "CONFIG_LOCALVERSION" arch/arm64/configs/cepheus_defconfig

      - name: Install toolchain (clang + GNU cross-compiler)
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm bc bison flex libssl-dev libelf-dev build-essential
          sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Fix yamltree.c (stub kosong, solusi dari TURTLE)
        run: |
          cd kernel
          cat > scripts/dtc/yamltree.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>

          struct dt_info;

          void dt_to_yaml(FILE *outf, struct dt_info *dti) {}
          CEOF
          echo "yamltree.c replaced with stub"

      - name: Upgrade SUSFS ke v2.1.0 (sinkron sama KSUN legacy)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/susfs.c" -o fs/susfs.c
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs.h" -o include/linux/susfs.h
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          grep "SUSFS_VERSION" include/linux/susfs.h

      - name: Sinkronkan fs/stat.c dengan SUSFS v2.1.0 (fix undefined symbol)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/stat.c" -o fs/stat.c
          grep -c "susfs" fs/stat.c

      - name: Sinkronkan fs/proc/task_mmu.c juga (biasanya sepaket sama stat.c)
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/proc/task_mmu.c" -o fs/proc/task_mmu.c
          grep -c "susfs" fs/proc/task_mmu.c

      - name: Inject 4 manual hook wajib KSUN (exec.c, open.c, stat.c, reboot.c)
        run: |
          cd kernel
          python3 - << 'PYEOF'
          import re, sys

          # CATATAN PERUBAHAN vs versi KSUN 3.2.0 (pinned commit) sebelumnya:
          # - Hook #3 (fs/read_write.c / ksu_handle_sys_read) DIHAPUS dari sini.
          #   Sudah dicek langsung ke source branch `legacy`: hook baca-file
          #   sekarang dipasang via kprobe internal KSUN sendiri
          #   (sys_read_handler_pre di kernel/runtime/ksud_integration.c),
          #   BUKAN lagi lewat call-site manual di kernel/fs. Signature lama
          #   (3 argumen, return int) sudah tidak ada -- diganti
          #   `void ksu_handle_sys_read(unsigned int fd)` dan dipanggil dari
          #   kprobe, bukan dari fs/read_write.c. Kalau tetap dipatch manual,
          #   build bakal gagal karena jumlah argumen sudah beda.
          # - Hook #1, #2, #4, #5 (execveat, faccessat, stat, reboot) TIDAK
          #   berubah -- signature sudah dicek identik dengan branch legacy
          #   HEAD saat ini, aman dipakai apa adanya.

          def patch(path, extern_anchor_pattern, extern_code, call_anchor_pattern, call_code, tag):
              with open(path, "r") as f:
                  src = f.read()

              if tag in src:
                  print(f"[{path}] {tag} sudah ada, skip")
                  return

              if extern_anchor_pattern is not None:
                  m = re.search(extern_anchor_pattern, src)
                  if not m:
                      print(f"[{path}] GAGAL: extern anchor gak ketemu -> {extern_anchor_pattern}")
                      sys.exit(1)
                  insert_at = m.start()
                  src = src[:insert_at] + extern_code + src[insert_at:]

              m2 = re.search(call_anchor_pattern, src)
              if not m2:
                  print(f"[{path}] GAGAL: call anchor gak ketemu -> {call_anchor_pattern}")
                  sys.exit(1)
              insert_at2 = m2.start()
              src = src[:insert_at2] + call_code + src[insert_at2:]

              with open(path, "w") as f:
                  f.write(src)
              print(f"[{path}] {tag} berhasil di-patch")

          # 1. fs/exec.c -> ksu_handle_execveat (signature tidak berubah)
          patch(
              "fs/exec.c",
              r"int do_execve\(struct filename \*filename,",
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n\n",
              r"return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);",
              "#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\t",
              "KSU_HOOK_EXEC",
          )

          # 2. fs/open.c -> ksu_handle_faccessat (signature tidak berubah)
          patch(
              "fs/open.c",
              r"SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)",
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n\n",
              r"if \(mode & ~S_IRWXO\)",
              "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n\t",
              "KSU_HOOK_FACCESSAT",
          )

          # 3. fs/stat.c -> ksu_handle_stat (signature tidak berubah)
          # CATATAN: fs/stat.c versi SUSFS v2.1.0 SUDAH mendeklarasikan
          # "extern int ksu_handle_stat(int *dfd, const char __user **filename_user);"
          # dengan 2 argumen (bukan 3). Jangan tambah extern baru -- cukup
          # insert pemanggilannya saja, 2-arg, biar match sama signature asli.
          patch(
              "fs/stat.c",
              None,
              "",
              r"error = vfs_fstatat\(dfd, filename, &stat, flag\);",
              "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename);\n#endif\n\t",
              "KSU_HOOK_STAT",
          )

          # 4. kernel/reboot.c -> ksu_handle_sys_reboot (signature tidak berubah)
          patch(
              "kernel/reboot.c",
              r"SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,",
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
              "#endif\n\n",
              r"/\* We only trust the superuser with rebooting the system\. \*/",
              "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\t",
              "KSU_HOOK_REBOOT",
          )
          PYEOF
          echo "=== Ringkasan hook yang kepasang ==="
          grep -rn "ksu_handle_" fs/exec.c fs/open.c fs/stat.c kernel/reboot.c

      - name: Verify hook call-sites (verify_ksu_hooks.py)
        run: |
          cd kernel
          # --sys-read DIHAPUS dari sini karena hook itu sekarang otomatis
          # via kprobe internal KSUN, bukan call-site manual lagi.
          python3 ../verify_ksu_hooks.py \
            --dfd fs/stat.c \
            --execveat fs/exec.c \
            --faccessat fs/open.c \
            --reboot kernel/reboot.c || {
            echo "Verifikasi hook GAGAL — cek output di atas sebelum lanjut build.";
            exit 1;
          }

      - name: Commit perubahan lokal sebelum cherry-pick
        run: |
          cd kernel
          git config user.email "ci@build.local"
          git config user.name "CI Build"
          git add -A
          git commit -m "local changes: defconfig + 4 KSUN manual hooks (exec/open/stat/reboot) + KSUN legacy branch" || echo "nothing to commit"

      - name: Enable F2FS optimization + KPROBES (wajib buat hook read internal KSUN legacy) di defconfig
        run: |
          cd kernel
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_XATTR=y
          CONFIG_F2FS_FS_POSIX_ACL=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_F2FS_CHECK_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          EOF
          echo "=== F2FS + KPROBES options added ==="
          grep -E "CONFIG_F2FS|CONFIG_KPROBES|CONFIG_KRETPROBES" arch/arm64/configs/cepheus_defconfig

      - name: Enable OverlayFS full feature (redirect_dir + index) di defconfig
        run: |
          cd kernel
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          EOF
          echo "=== OverlayFS options added ==="
          grep "CONFIG_OVERLAY_FS" arch/arm64/configs/cepheus_defconfig

      - name: Build kernel (pakai flag dari build.sh asli raystef66)
        run: |
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export AR=llvm-ar
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=1

          make O=out ARCH=arm64 cepheus_defconfig

          make ARCH=arm64 \
               O=out \
               CC=clang \
               AR=llvm-ar \
               LD=ld.lld \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               -j$(nproc --all) Image.gz-dtb

          echo "=== Verify Image.gz-dtb ==="
          ls out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/Image kernel-pure.img
          cd AnyKernel3 && zip -r9 ../InfiniR_cepheus_KSUN-legacy_F2FS.zip * -x README

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniR-cepheus-KSUN-legacy-F2FS
          path: |
            InfiniR_cepheus_KSUN-legacy_F2FS.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel-pure.img
